<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LSV Newsroom</title>
  <style>
    :root{
      /* Wirklich rot: dunkles Weinrot + roter Accent */
      --bg: #1a070a;
      --bg2:#22090d;
      --card:#240a0f;
      --border: rgba(255,255,255,.10);
      --text:#fff3f5;
      --muted: rgba(255,243,245,.78);

      --accent: #ff1f4a;   /* echtes Rot */
      --accent2:#ff6b86;   /* helleres Rot */
      --pillBg: rgba(255,31,74,.14);
      --pillBorder: rgba(255,31,74,.30);

      --shadow: rgba(0,0,0,.30);
    }

    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      margin:0; background:var(--bg); color:var(--text);
    }

    header{
      padding: 16px 14px;
      position: sticky; top:0; z-index:10;
      background: rgba(26,7,10,.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    h1{ font-size:16px; margin:0 0 10px; letter-spacing:.2px; }

    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

    select, input, button{
      background: #2a0c12;
      color: var(--text);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14px;
      box-shadow: 0 10px 22px var(--shadow);
    }

    button{ cursor:pointer; border-color: rgba(255,31,74,.28); }
    button:hover{ border-color: rgba(255,31,74,.55); }

    .pill{
      font-size:12px; padding:4px 10px;
      border-radius:999px;
      background: var(--pillBg);
      border:1px solid var(--pillBorder);
      color: var(--text);
      display:inline-flex; gap:6px; align-items:center;
    }

    .pillMuted{
      background: rgba(255,255,255,.06);
      border-color: rgba(255,255,255,.14);
      color: var(--muted);
    }

    .status{ font-size:12px; margin-top:10px; line-height:1.35; color: var(--muted); }

    main{ padding: 14px; display:grid; gap: 12px; }

    .card{
      background: var(--card);
      border:1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 14px 32px var(--shadow);
      display:grid;
      gap:10px;
    }

    .meta{
      font-size:12px;
      color: var(--muted);
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    }

    .title{ font-size:15px; font-weight: 760; margin: 0; line-height:1.25; }
    .desc{ font-size:13px; color: rgba(255,243,245,.92); margin:0; line-height:1.35; }

    a{ color: var(--accent2); text-decoration:none; }
    a:hover{ text-decoration: underline; }

    .thumb{
      width:100%;
      aspect-ratio: 16/9;
      border-radius: 16px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.10);
      background: #120507;
    }
    .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }

    .pubRow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .favicon{
      width: 18px; height: 18px;
      border-radius: 6px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      overflow:hidden;
      flex: 0 0 auto;
    }
    .favicon img{ width:100%; height:100%; display:block; }

    .tagRow{ display:flex; gap:8px; flex-wrap:wrap; }

    .danger{
      background: rgba(255, 120, 120, .10);
      border-color: rgba(255, 120, 120, .30);
    }
  </style>
</head>
<body>
<header>
  <h1>LSV Newsroom</h1>

  <div class="row">
    <select id="engine"></select>
    <input id="search" placeholder="Suche (Titel/Quelle/Tags)" />
    <button id="refresh">Refresh</button>
    <span class="pill" id="count">0 Artikel</span>
    <span class="pill pillMuted" id="last">—</span>
  </div>

  <div class="status" id="status">Ready.</div>
</header>

<main id="list"></main>

<script>
  // =======================
  // ENGINES (free)
  // =======================
  const ENGINES = [
    {
      name: "Google News",
      id: "google",
      buildUrl: (query) => 'https://news.google.com/rss/search?q=' + encodeURIComponent(query) + '&hl=de&gl=DE&ceid=DE:de'
    },
    {
      name: "GDELT",
      id: "gdelt",
      buildUrl: (query) => {
        const base = 'https://api.gdeltproject.org/api/v2/doc/doc';
        const params = new URLSearchParams({
          query,
          mode: 'ArtList',
          format: 'rss',
          sort: 'HybridRel',
          maxrecords: '50'
        });
        return base + '?' + params.toString();
      }
    }
  ];

  // Free CORS Proxy
  const PROXY = (url) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);

  // Archiv: 3 Monate
  const MAX_AGE_MS = 90 * 24 * 60 * 60 * 1000;

  // Auto-Refresh: 90 Sekunden
  const REFRESH_EVERY_MS = 90 * 1000;

  // =======================
  // LOCKED: Kategorien (nicht editierbar)
  // =======================
  const CATEGORIES = [
    { name: "Personen", keywords: ['Luca Albert Dobrita','Ted Krämer','Laurenz Spies'] },
    { name: "Organisationen", keywords: ['LSV Hessen','Bundesschülerkonferenz','HUSKJ','KiJuIV'] },
    { name: "Behörden/Politik", keywords: ['Kultusministerium Hessen','HKM','Hessisches Kultusministerium','Kultusministerium'] },
    { name: "Themen", keywords: ['Bildung','Schülervertretung','Schulsprecher','Schule','Schulpolitik','Mitbestimmung'] }
  ];

  // Basis-Kontext, damit Treffer „Hessen“-nah bleiben, aber nicht zu eng
  const BASE_QUERY = '(Hessen OR "Land Hessen" OR Frankfurt OR Wiesbaden OR Offenbach OR Darmstadt)';

  // =======================
  // STORAGE
  // =======================
  const storeKey  = "lsv_news_archive_locked_v1";
  const settingsKey = "lsv_news_settings_locked_v1";

  // =======================
  // STATE
  // =======================
  const $ = (id) => document.getElementById(id);

  let archive = loadJSON(storeKey, {});
  let settings = loadJSON(settingsKey, { engineId: "google" });

  // =======================
  // INIT UI
  // =======================
  const engineSel = $("engine");
  const searchInp = $("search");

  ENGINES.forEach(e=>{
    const opt=document.createElement("option");
    opt.value=e.id; opt.textContent=e.name;
    engineSel.appendChild(opt);
  });
  engineSel.value = settings.engineId || "google";

  engineSel.addEventListener("change", async ()=>{
    settings.engineId = engineSel.value;
    saveJSON(settingsKey, settings);
    $("status").textContent = "✅ Engine gespeichert. Lade News…";
    await refresh();
  });

  $("refresh").addEventListener("click", refresh);
  searchInp.addEventListener("input", render);

  // =======================
  // HELPERS
  // =======================
  function loadJSON(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return fallback;
      return JSON.parse(raw);
    }catch{ return fallback; }
  }
  function saveJSON(key, obj){
    localStorage.setItem(key, JSON.stringify(obj));
  }
  function pruneArchive(){
    const now = Date.now();
    for(const [id,item] of Object.entries(archive)){
      const t = item?.published || 0;
      if(!t || (now - t) > MAX_AGE_MS) delete archive[id];
    }
  }
  function hashId(str){
    let h=0;
    for(let i=0;i<str.length;i++) h=(h*31 + str.charCodeAt(i))>>>0;
    return String(h);
  }
  function stripHtml(s){
    const div=document.createElement("div");
    div.innerHTML=s||"";
    return (div.textContent || div.innerText || "").trim();
  }
  function fmtDate(ms){
    try{ return new Date(ms).toLocaleString("de-DE"); }catch{ return ""; }
  }
  function escapeHtml(s=""){
    return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
  }
  function escapeAttr(s=""){ return escapeHtml(s); }

  function extractFirstImageUrlFromHtml(html){
    if(!html) return "";
    const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
    return m ? m[1] : "";
  }
  function getMediaUrl(itemNode){
    const mc=itemNode.getElementsByTagName("media:content");
    if(mc && mc[0]?.getAttribute){
      const u=mc[0].getAttribute("url"); if(u) return u;
    }
    const mt=itemNode.getElementsByTagName("media:thumbnail");
    if(mt && mt[0]?.getAttribute){
      const u=mt[0].getAttribute("url"); if(u) return u;
    }
    return "";
  }
  function getDomain(url){
    try{ return new URL(url).hostname.replace(/^www\./,""); }catch{ return ""; }
  }
  function faviconUrl(domain){
    return domain ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64` : "";
  }

  function computeTags(text){
    const t = (text||"").toLowerCase();
    const tags = [];
    for(const cat of CATEGORIES){
      const hit = (cat.keywords||[]).some(k=>{
        const kk=(k||"").toLowerCase();
        return kk && t.includes(kk);
      });
      if(hit) tags.push(cat.name);
    }
    return tags;
  }

  function buildGlobalQuery(){
    const allKeywords = CATEGORIES.flatMap(c=>c.keywords||[]).filter(Boolean);
    const orBlock = allKeywords.length
      ? "(" + allKeywords.map(k => needsQuotes(k) ? `"${k.replaceAll('"','')}"` : k).join(" OR ") + ")"
      : "";

    // bewusst nicht zu strict: orBlock + BASE_QUERY reicht
    const q = [orBlock, "(" + BASE_QUERY + ")"].filter(Boolean).join(" ");
    return q.trim() || "Schule Hessen";
  }

  function needsQuotes(k){
    return /\s/.test(k) || /[äöüÄÖÜß]/.test(k) || /[()]/.test(k);
  }

  function getEngine(){
    const id=settings.engineId || "google";
    return ENGINES.find(e=>e.id===id) || ENGINES[0];
  }

  function parseRSS(xmlText){
    const parser=new DOMParser();
    const xml=parser.parseFromString(xmlText,"text/xml");
    const items=[...xml.querySelectorAll("item")].slice(0,60);

    const out=[];
    for(const it of items){
      const title = it.querySelector("title")?.textContent?.trim() || "";
      const link  = it.querySelector("link")?.textContent?.trim() || "";
      const pub   = it.querySelector("pubDate")?.textContent?.trim() || "";
      const source= it.querySelector("source")?.textContent?.trim() || "Quelle";
      const descRaw = it.querySelector("description")?.textContent?.trim() || "";

      const published = pub ? Date.parse(pub) : Date.now();
      const id = hashId(link || title);

      const img = getMediaUrl(it) || extractFirstImageUrlFromHtml(descRaw);
      const desc = stripHtml(descRaw);

      const domain = getDomain(link);
      const fav = faviconUrl(domain);

      const tags = computeTags(`${title} ${desc} ${source} ${domain}`);

      out.push({ id, title, link, published, source, desc, img, domain, fav, tags });
    }
    return out;
  }

  // =======================
  // CORE
  // =======================
  async function refresh(){
    pruneArchive();
    $("status").textContent = "Hole News…";

    try{
      const engine=getEngine();
      const q = buildGlobalQuery();
      const url = engine.buildUrl(q);

      const res = await fetch(PROXY(url), { cache:"no-store" });
      if(!res.ok) throw new Error("Proxy HTTP " + res.status);

      const text = await res.text();
      const items = parseRSS(text);

      let added=0;
      for(const it of items){
        if(!archive[it.id]){ archive[it.id]=it; added++; }
        else{
          archive[it.id].published = archive[it.id].published || it.published;
          archive[it.id].img = archive[it.id].img || it.img;
          archive[it.id].fav = archive[it.id].fav || it.fav;
          archive[it.id].domain = archive[it.id].domain || it.domain;
          archive[it.id].tags = (archive[it.id].tags && archive[it.id].tags.length) ? archive[it.id].tags : it.tags;
        }
      }

      saveJSON(storeKey, archive);
      $("last").textContent = "Update: " + new Date().toLocaleTimeString("de-DE");
      $("status").textContent = added ? `✅ ${added} neue Artikel.` : "✅ Keine neuen Treffer.";
      render();
    }catch(e){
      console.error(e);
      $("status").textContent = "⚠️ Laden fehlgeschlagen. Free Proxy kann kurz spinnen.";
      render(true);
    }
  }

  function render(isError=false){
    pruneArchive();

    const filter = (searchInp.value || "").trim().toLowerCase();
    let items = Object.values(archive).sort((a,b)=>(b.published||0)-(a.published||0));

    if(filter){
      items = items.filter(x => (`${x.title} ${x.source} ${(x.tags||[]).join(" ")} ${x.domain}`.toLowerCase()).includes(filter));
    }

    $("count").textContent = `${items.length} Artikel`;

    const root = $("list");
    root.innerHTML = "";

    if(isError){
      const warn=document.createElement("div");
      warn.className="card";
      warn.innerHTML = `
        <div class="meta"><span class="pill danger">Hinweis</span><span>Proxy/Quelle hat kurz gezickt</span></div>
        <p class="desc">Refresh später nochmal. Wenn das ständig nervt, machen wir den Proxy auf Cloudflare – weiterhin free, aber stabiler.</p>
      `;
      root.appendChild(warn);
    }

    if(!items.length){
      const empty=document.createElement("div");
      empty.className="card";
      empty.innerHTML = `
        <div class="meta"><span class="pill">0 Treffer</span><span class="pill pillMuted">Quick Fix</span></div>
        <h2 class="title">Gerade keine Artikel im Feed</h2>
        <p class="desc">
          Wechsel testweise auf Engine <b>Google News</b>. Wenn du seltene Namen trackst, kommen Treffer manchmal nur sporadisch.
        </p>
      `;
      root.appendChild(empty);
      return;
    }

    for(const it of items){
      const el=document.createElement("div");
      el.className="card";

      const thumb = it.img
        ? `<div class="thumb"><img src="${escapeAttr(it.img)}" alt="Vorschaubild" loading="lazy"></div>`
        : "";

      const fav = it.fav
        ? `<span class="favicon"><img src="${escapeAttr(it.fav)}" alt="" loading="lazy"></span>`
        : "";

      const tags = (it.tags||[]).slice(0,3).map(t=>`<span class="pill">${escapeHtml(t)}</span>`).join("");
      const tagRow = tags ? `<div class="tagRow">${tags}</div>` : `<div class="tagRow"><span class="pill pillMuted">ungetaggt</span></div>`;

      el.innerHTML = `
        ${thumb}
        <div class="meta pubRow">
          ${fav}
          <span>${escapeHtml(it.source || "Quelle")}</span>
          ${it.domain ? `<span class="pill pillMuted">${escapeHtml(it.domain)}</span>` : ""}
          <span class="pill pillMuted">${escapeHtml(fmtDate(it.published))}</span>
        </div>
        <h2 class="title">${escapeHtml(it.title)}</h2>
        <p class="desc">${escapeHtml((it.desc||"").slice(0, 240))}${(it.desc||"").length>240 ? "…" : ""}</p>
        ${tagRow}
        <div class="row">
          <a href="${escapeAttr(it.link)}" target="_blank" rel="noopener">Artikel öffnen →</a>
        </div>
      `;

      root.appendChild(el);
    }
  }

  // =======================
  // START
  // =======================
  (async ()=>{
    render();
    await refresh();
    setInterval(refresh, REFRESH_EVERY_MS);
  })();
</script>
</body>
</html>
